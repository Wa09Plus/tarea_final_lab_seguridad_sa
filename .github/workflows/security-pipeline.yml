name: DevSecOps Security Pipeline - InternalDesk API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # GATE 1 (BLOQUEO): Pruebas automatizadas de seguridad (pytest)
  # =========================================================================
  security-tests:
    name: "Gate 1 - Pruebas de Seguridad (pytest)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias congeladas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
      - name: Ejecutar suite pytest (BLOQUEO si falla alguna prueba)
        run: |
          set -o pipefail
          mkdir -p ci_reports
          echo "[BLOQUEO] Criterio 1: Fallo en pruebas automatizadas de seguridad."
          pytest -v | tee ci_reports/pytest_ci.txt
      - name: Guardar reporte pytest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-pytest
          path: ci_reports/pytest_ci.txt

  # =========================================================================
  # GATE 2 (BLOQUEO): SAST con Semgrep + Regla Personalizada
  # =========================================================================
  sast-semgrep:
    name: "Gate 2 - SAST Semgrep y Regla Propia"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Semgrep
        run: pip install semgrep
      - name: Validar regla personalizada (caso incumplido vs caso cumplido)
        run: |
          set -o pipefail
          mkdir -p ci_reports
          semgrep --test --config seguridad/semgrep_rules.yml seguridad/semgrep_test_casos.py | tee ci_reports/semgrep_rule_test.txt
      - name: Ejecutar Semgrep sobre app_final_sa (BLOQUEO en severidad ERROR)
        run: |
          echo "[BLOQUEO] Criterio 2: Hallazgo SAST que supera el umbral definido (ERROR)."
          semgrep scan \
            --config seguridad/semgrep_rules.yml \
            --config p/python \
            --metrics=off \
            --severity ERROR \
            --error \
            --json --output ci_reports/semgrep_report.json \
            app_final_sa
      - name: Guardar reportes Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-semgrep
          path: ci_reports/

  # =========================================================================
  # SCA + SBOM
  # =========================================================================
  sca-and-sbom:
    name: "SCA (pip-audit) y SBOM (CycloneDX)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pip-audit y cyclonedx-bom
        run: pip install pip-audit cyclonedx-bom
      - name: Ejecutar SCA y generar SBOM CycloneDX JSON
        run: |
          mkdir -p ci_reports
          pip-audit -r requirements-lock.txt --format json --output ci_reports/pip_audit_ci.json
          cyclonedx-py requirements requirements-lock.txt --of JSON -o ci_reports/sbom_ci.json
      - name: Guardar reportes SCA y SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-sca-sbom
          path: ci_reports/

  # =========================================================================
  # GATE 3 (BLOQUEO): Evaluación de Política OPA (Rego)
  # =========================================================================
  policy-opa:
    name: "Gate 3 - Política de Configuración (OPA)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar OPA CLI
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/v1.0.0/opa_linux_amd64_static
          chmod 755 opa
          sudo mv opa /usr/local/bin/opa
          opa version
      - name: Demostrar evaluación de casos de prueba (permitido vs denegado)
        run: |
          mkdir -p ci_reports
          echo "=== CASO PERMITIDO (input_allow.json) ===" | tee ci_reports/opa_eval.txt
          opa eval -d politica/security.rego -i politica/input_allow.json "data.internaldesk.security.deny" | tee -a ci_reports/opa_eval.txt
          echo "=== CASO DENEGADO (input_deny.json) ===" | tee -a ci_reports/opa_eval.txt
          opa eval -d politica/security.rego -i politica/input_deny.json "data.internaldesk.security.deny" | tee -a ci_reports/opa_eval.txt
      - name: Evaluar configuración activa deploy_config.json (BLOQUEO con --fail-defined)
        run: |
          set -o pipefail
          echo "[BLOQUEO] Criterio 3: Incumplimiento de política de configuración (OPA --fail-defined)."
          opa eval --fail-defined -d politica/security.rego -i politica/deploy_config.json "data.internaldesk.security.deny[_]" | tee -a ci_reports/opa_eval.txt
      - name: Guardar reporte OPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-opa
          path: ci_reports/opa_eval.txt

  # =========================================================================
  # CONTENEDOR: Build Dockerfile + Escaneo con Trivy
  # =========================================================================
  container-trivy:
    name: "Contenedor Docker y Escaneo Trivy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen Docker local
        run: docker build -t internaldesk-api:lab .
      - name: Escaneo informativo Trivy
        run: |
          echo "[ADVERTENCIA] Hallazgos informativos de imagen base documentados en trivy_report.txt"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd):/workspace" \
            -w /workspace \
            aquasec/trivy:latest image \
            --severity CRITICAL,HIGH,MEDIUM,LOW \
            --exit-code 0 \
            --output trivy_report.txt \
            internaldesk-api:lab
          cat trivy_report.txt
      - name: Guardar reporte Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-trivy
          path: trivy_report.txt

  # =========================================================================
  # DAST: OWASP ZAP Baseline sobre el laboratorio local en el runner
  # =========================================================================
  dast-zap:
    name: "DAST - OWASP ZAP Baseline"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias y levantar API en localhost
        run: |
          pip install -r requirements-lock.txt
          nohup uvicorn app_final_sa.main:app --host 127.0.0.1 --port 8000 > uvicorn_zap.log 2>&1 &
          for i in {1..15}; do
            if curl -sf http://127.0.0.1:8000/health; then
              echo "API lista en http://127.0.0.1:8000"
              break
            fi
            sleep 1
          done
      - name: Ejecutar OWASP ZAP Baseline (solo laboratorio autorizado)
        run: |
          mkdir -p zap_out
          chmod 777 zap_out
          echo "[ADVERTENCIA] ZAP Baseline corre con -I para reportar alertas pasivas sin bloquear por encabezados informativos."
          docker run --rm --network host \
            -v "$(pwd)/zap_out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8000/docs \
            -r zap_report.html \
            -J zap_report.json \
            -w zap_report.md \
            -I
      - name: Guardar reportes OWASP ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-zap
          path: |
            zap_out/
            uvicorn_zap.log