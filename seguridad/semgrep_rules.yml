rules:
  - id: internaldesk-sqlite-sqli-fstring
    mode: taint
    languages: [python]
    severity: ERROR
    message: >
      Posible SQL Injection: se construyó una consulta SQL mediante f-string o
      concatenación antes de pasarla a .execute(). Utilice consultas parametrizadas (?).
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"
      references:
        - "OWASP ASVS 5.0"
    pattern-sources:
      - pattern: f"..."
      - pattern: $A + $B
    pattern-sinks:
      - patterns:
          - pattern: $CONN.execute($SQL, ...)
          - focus-metavariable: $SQL